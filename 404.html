<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Kenshō</title>
  <meta name="description" content="Página não encontrada — retorne ao Kenshō." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0A0A0A;
      color: #FDFBF7;
      font-family: "Montserrat", sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(6rem, 18vw, 14rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.05em;
      color: rgba(253, 251, 247, 0.06);
      margin-bottom: 1rem;
    }
    .error-msg {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: rgba(253, 251, 247, 0.4);
      margin-bottom: 3rem;
      font-weight: 300;
    }
    .error-back {
      display: inline-block;
      padding: 0.85rem 2.5rem;
      border: 1px solid rgba(253, 251, 247, 0.2);
      color: rgba(253, 251, 247, 0.8);
      text-decoration: none;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-weight: 400;
      transition: all 0.4s ease;
      border-radius: 2px;
    }
    .error-back:hover {
      background: rgba(253, 251, 247, 0.06);
      border-color: rgba(253, 251, 247, 0.4);
      color: #FDFBF7;
    }
  </style>
</head>
<body>
  <div class="error-code">404</div>
  <p class="error-msg">Esta página não existe</p>
  <a href="index.html" class="error-back">Voltar ao início</a>
</body>
</html>
